[project]
name = "gesture-detection"
version = "0.1.0"
description = "Browser-based real-time hand gesture detection, deployed on Render"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
